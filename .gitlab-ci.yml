# ─────────────────────────────────────────────────────────────────────────────
# GitLab CI/CD Pipeline — Playwright + TestNG + Allure (Romania Sanity Suite)
# ─────────────────────────────────────────────────────────────────────────────
# Required GitLab CI/CD variables (Settings → CI/CD → Variables):
#   APP_USERNAME  — test account email    (masked, protected)
#   APP_PASSWORD  — test account password (masked, protected)
# ─────────────────────────────────────────────────────────────────────────────

default:
  image: maven:3.9.6-eclipse-temurin-17   # JDK 17 + Maven; adjust tag to match your project Java version

stages:
  - test

sanity-romania:
  stage: test

  variables:
    # Non-sensitive defaults — override at pipeline trigger time if needed
    ENV: "ro"
    SUITE: "src/test/resources/suites/sanity-romania.xml"
    BROWSER_HEADLESS: "true"

  script:
    # Install Playwright browsers on the fresh runner
    - mvn -q exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium" || true

    # Run tests — credentials come from masked CI/CD variables
    - >
      mvn clean test
      -Denv=${ENV}
      -Dapp.username=${APP_USERNAME}
      -Dapp.password=${APP_PASSWORD}
      -Dsuite=${SUITE}
      -Dbrowser.headless=${BROWSER_HEADLESS}

    # Generate the static Allure HTML report from target/allure-results
    - mvn allure:report

  artifacts:
    name: "allure-report-$CI_JOB_NAME-$CI_COMMIT_SHORT_SHA"
    expire_in: 2 weeks
    when: always          # save the report even when tests fail
    paths:
      - target/site/allure-maven-plugin/   # HTML report generated by allure:report
      - target/allure-results/             # raw JSON results (useful for trend history)

  # Optional: restrict execution to specific branches or make it manual
  # rules:
  #   - if: '$CI_COMMIT_BRANCH == "main"'
  #   - when: manual
